name: Build and Release

# リリース手順
#   1. manifest の version / gameVersion を上げて既定ブランチへマージ
#   2. X.X.X (manifest の version) のタグを手動作成して push
#      (例: git tag 1.2.3 && git push origin 1.2.3)
#   3. タグ push がビルドを実行し、<ModName>-<version>-bs<GameVersion> という
#      リリース名で成果物を添付する
on:
  # 手動実行と PR はビルド検証のみ (リリースしない)
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-and-release.yml
      - 'SongRequestManagerV2/**'
  push:
    # 既定ブランチへの push はビルド検証のみ
    branches: [master]
    # リリースは X.X.X (manifest の version) タグを手動 push したときだけ
    tags:
      - '[0-9]*'
    paths:
      - .github/workflows/build-and-release.yml
      - 'SongRequestManagerV2/**'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    outputs:
      zip-name: ${{ steps.package.outputs.zip-name }}
      version: ${{ steps.manifest.outputs.version }}
      game-version: ${{ steps.manifest.outputs.game-version }}
      tag: ${{ steps.manifest.outputs.tag }}
      release-name: ${{ steps.manifest.outputs.release-name }}
      commit: ${{ steps.manifest.outputs.commit }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Read manifest
        id: manifest
        shell: pwsh
        run: |
          $manifest = Get-Content 'SongRequestManagerV2/manifest.json' -Raw | ConvertFrom-Json

          # これらの値はリリースジョブのシェルに渡るため、許可した形式のみ受け付ける。
          if ($manifest.id -notmatch '^[A-Za-z0-9_]+$') { throw "manifest id is invalid: '$($manifest.id)'" }
          if ($manifest.version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') { throw "manifest version is invalid: '$($manifest.version)'" }
          if ($manifest.gameVersion -notmatch '^[0-9]+(\.[0-9]+)+$') { throw "manifest gameVersion is invalid: '$($manifest.gameVersion)'" }

          # タグは X.X.X (manifest の version) で、リリース名は過去のリリースと同じ
          # <ModName>-<version>-bs<GameVersion> にする。
          $releaseName = '{0}-{1}-bs{2}' -f $manifest.id, $manifest.version, $manifest.gameVersion

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -ne $manifest.version) {
              throw "Tag '$tag' does not match the manifest version '$($manifest.version)'. version を上げてからタグを作り直してください。"
            }
          } else {
            $tag = $manifest.version
          }

          "version=$($manifest.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "game-version=$($manifest.gameVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release-name=$releaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "commit=$($env:GITHUB_SHA)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # BeatMods から参照アセンブリと依存 MOD を取得する。
      # このプロジェクトは csproj に DependsOn item を持たず、依存は manifest.json にある。
      # setup-beat-saber が読むのは csproj の DependsOn だけなので、
      # game-version と additional-dependencies をここで明示する。
      # アクションは範囲内で対象 GameVersion に対応した最も低いバージョンを選ぶ。
      # CatCore 2.0.0-alpha2 は BeatMods 未登録のため、この一覧には含めず次のステップで取得する。
      - name: Set up Beat Saber
        uses: nicoco007/setup-beat-saber@v1
        with:
          project-path: ${{ github.workspace }}\SongRequestManagerV2\SongRequestManagerV2.csproj
          game-version: ${{ steps.manifest.outputs.game-version }}
          additional-dependencies: |
            {
              "BSIPA": "^4.3.6",
              "SiraUtil": "^3.2.1",
              "BeatSaberMarkupLanguage": "^1.12.5",
              "SongCore": "^3.15.3"
            }

      # manifest が要求する CatCore 2.0.0-alpha2 は BeatMods に無いため、
      # フォークの GitHub Releases から取得して参照用 Libs に置く。
      # CatCore のバージョンを上げるときは、ここと manifest.json を揃える。
      # $sha256 はリリースアセットの digest (sha256:) と一致させる。
      - name: Fetch CatCore prerelease
        shell: pwsh
        run: |
          $version = '2.0.0-alpha2'
          $sha256 = '89a09b679b733cf15e9a1e82c7990aac3f1bf31210342204c8bdebb1becac3e2'
          $url = "https://github.com/denpadokei/CatCore/releases/download/${version}/CatCore-${version}-4868e41.zip"
          $zip = Join-Path $env:RUNNER_TEMP "CatCore-${version}.zip"
          $extract = Join-Path $env:RUNNER_TEMP "CatCore-${version}"
          Invoke-WebRequest $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $sha256) {
            throw "CatCore archive hash mismatch: expected $sha256, got $actual"
          }
          Expand-Archive $zip -DestinationPath $extract -Force
          Copy-Item (Join-Path $extract 'Libs\CatCore.dll') (Join-Path $env:BeatSaberDir 'Libs\CatCore.dll') -Force

      - name: Build Release
        shell: pwsh
        run: |
          # csproj は ..\Refs があるときだけ BeatSaberDir を使うので、CI では明示的に渡す。
          dotnet build "${{ github.workspace }}\SongRequestManagerV2\SongRequestManagerV2.csproj" -c Release `
            -p:BeatSaberDir="$env:BeatSaberDir" `
            -p:GameDirectory="$env:BeatSaberDir" `
            -p:LocalRefsDir="$env:BeatSaberDir" `
            -p:DisableCopyToPlugins=true

      - name: Package release zip
        id: package
        shell: pwsh
        run: |
          # CI (GITHUB_ACTIONS) では BSMT が ZipRelease を無効化するため、
          # BSMT が組み立てた Artifact ディレクトリを自分で zip にする。
          $manifest = Get-Content 'SongRequestManagerV2/manifest.json' -Raw | ConvertFrom-Json
          $artifact = Get-ChildItem '${{ github.workspace }}\SongRequestManagerV2\bin\Release' -Recurse -Directory -Filter Artifact -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $artifact) { throw 'BeatSaberModdingTools did not produce an Artifact directory under bin\Release.' }

          $name = '{0}-{1}-bs{2}' -f $manifest.id, $manifest.version, $manifest.gameVersion
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Compress-Archive -Path (Join-Path $artifact.FullName '*') -DestinationPath $zip -Force

          "zip-path=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip-name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Package: $zip"
          Get-ChildItem $artifact.FullName -Recurse -File | ForEach-Object { Write-Host "  " $_.FullName.Substring($artifact.FullName.Length + 1) }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip-name }}
          path: ${{ steps.package.outputs.zip-path }}
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    # 手動作成した X.X.X タグを push したときだけ実行する。
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download release zip
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.zip-name }}
          path: release

      - name: Attach artifact and set release name
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          RELEASE_NAME: ${{ needs.build.outputs.release-name }}
          COMMIT: ${{ needs.build.outputs.commit }}
          ZIP_NAME: ${{ needs.build.outputs.zip-name }}
          VERSION: ${{ needs.build.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="$REPO"
          tag="$TAG"
          release_name="$RELEASE_NAME"
          sha="$COMMIT"
          zip="release/${ZIP_NAME}.zip"
          notes="${release_name} ($(printf '%s' "$sha" | cut -c1-7))."

          if [ ! -f "$zip" ]; then
            echo "::error::release asset '$zip' not found"; exit 1
          fi

          version="$VERSION"

          # セマンティックバージョンのプレリリースは prerelease として作成し、
          # Latest バッジを通常リリースから奪わないようにする。
          pre=()
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            pre=(--prerelease --latest=false)
          fi

          # タグは手動作成済みなので、そのコミットをビルドしたことを確認する。
          tag_sha=$(gh api "repos/$repo/commits/$tag" --jq .sha 2>/dev/null || true)
          if ! [[ "$tag_sha" =~ ^[0-9a-f]{40}$ ]]; then
            tag_sha=""
          fi
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$sha" ]; then
            echo "::warning::tag '$tag' points to $tag_sha but this run built $sha; skipping release."
            exit 0
          fi

          # 既にリリースがあれば名前を <ModName>-<version>-bs<GameVersion> に揃えて成果物を差し替える。
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$repo" --title "$release_name" "${pre[@]}"
          else
            gh release create "$tag" --repo "$repo" --title "$release_name" --notes "$notes" --verify-tag "${pre[@]}"
          fi
          gh release upload "$tag" "$zip" --repo "$repo" --clobber
